name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENT_ENVIRONMENT: test
      AGENT_LLM_PROVIDER: mock
      AGENT_LLM_MODEL: mock
      AGENT_AUTH_ENABLED: "false"
      AGENT_RATE_LIMIT_ENABLED: "false"
      AGENT_PRELOAD_EMBEDDING_MODEL: "false"
      AGENT_CONVERSATION_DB_PATH: ":memory:"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app scripts

      - name: Run regression suite
        run: python -m scripts.run_regression

      - name: Run retrieval evaluation
        run: python -m scripts.evaluate_retrieval

      - name: Run agent policy evaluation
        run: python -m scripts.evaluate_agent
